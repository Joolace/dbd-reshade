# Checks presets.json, the translations and the map screenshot folders on every change.
# A red ❌ on a commit or pull request means users would get broken data: the log says what to fix.
name: Validate presets and translations

on:
  push:
    paths:
      - 'media/presets.json'
      - 'Presets/**'
      - 'media/preview-preset/**'
      - 'Maps/**'
      - 'translations/**'
      - 'tools/**'
  pull_request:
    paths:
      - 'media/presets.json'
      - 'Presets/**'
      - 'media/preview-preset/**'
      - 'Maps/**'
      - 'translations/**'
      - 'tools/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # No file contents beyond what's listed below: the preview images alone are ~1 GB.
          filter: blob:none
          sparse-checkout: |
            media/presets.json
            Presets
            translations
            tools
          sparse-checkout-cone-mode: false

      # Only the names of previews and map screenshots are needed: create empty placeholders from the git tree.
      - name: List image file names
        run: |
          mkdir -p media/preview-preset
          git -c core.quotePath=false ls-tree -r --name-only HEAD media/preview-preset/ Maps/ |
            while IFS= read -r f; do mkdir -p "$(dirname "$f")"; touch "$f"; done

      - name: Validate presets, translations and maps
        run: python3 tools/validate.py
