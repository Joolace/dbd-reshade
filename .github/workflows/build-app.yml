# Builds the Windows app in app/ on every change, and attaches DBDReshade.exe to a GitHub release
# when a tag is pushed (e.g. v2.0.0). The app checks these releases to tell users about updates.
name: Build app

on:
  push:
    branches: [ wpf-app ]
    paths:
      - 'app/**'
      - '.github/workflows/build-app.yml'
    tags: [ 'v*' ]
  pull_request:
    paths:
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Only the app: skips downloading the ~1 GB of preset previews.
          filter: blob:none
          sparse-checkout: app

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build app/DBDReshade.sln -c Release

      - name: Publish single-file exe
        run: dotnet publish app/src/DBDReshade/DBDReshade.csproj -c Release -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DBDReshade
          path: publish/DBDReshade.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/DBDReshade.exe
          generate_release_notes: true
